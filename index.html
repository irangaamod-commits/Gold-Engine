<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Gold Multi-Timeframe Liquidity Engine</title>
  <!-- Force exact version 4.1.1 to avoid caching issues -->
  <script src="https://unpkg.com/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>
  <style>
    :root {
      --bg: #0f1218;
      --card: #171c26;
      --tx: #ecebe6;
      --mut: #8f93a0;
      --grid: #1d2330;
      --up: #2fd3a0;
      --dn: #ff5f7e;
      --gold: #e6b450;
      --line: #262d3b;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: var(--bg);
      color: var(--tx);
      font-family: system-ui, -apple-system, sans-serif;
      overflow-x: hidden;
    }
    body {
      display: flex;
      flex-direction: column;
      padding: 8px;
      gap: 8px;
    }
    
    body.is-fullscreen {
      padding: 0;
      gap: 0;
    }
    body.is-fullscreen header,
    body.is-fullscreen .controls-panel,
    body.is-fullscreen .metrics-grid {
      display: none !important;
    }
    body.is-fullscreen #chart-container {
      height: 100vh !important;
      border-radius: 0;
      border: none;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 8px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 6px;
    }
    h1 { font-size: 15px; margin: 0; font-weight: 600; color: var(--gold); }
    #status {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 12px;
      border: 1px solid var(--line);
      color: var(--mut);
      max-width: 150px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #status.live { color: var(--up); border-color: var(--up); }
    #status.error { color: var(--dn); border-color: var(--dn); }

    .controls-panel {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      background: var(--card);
      padding: 6px;
      border-radius: 6px;
      border: 1px solid var(--line);
    }
    .tf-group, .action-group {
      display: flex;
      gap: 4px;
    }
    button {
      background: var(--bg);
      color: var(--tx);
      border: 1px solid var(--line);
      padding: 6px 12px;
      border-radius: 4px;
      font-size: 12px;
      cursor: pointer;
      font-weight: 600;
    }
    button.active {
      background: var(--gold);
      color: #000;
      border-color: var(--gold);
    }
    button.fs-btn {
      background: #2a3245;
    }

    #chart-container {
      width: 100%;
      height: 55vh;
      min-height: 280px;
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 6px;
      position: relative;
    }

    #signal-box {
      background: var(--card);
      padding: 10px;
      border-radius: 6px;
      border: 1px solid var(--line);
      border-left: 5px solid var(--mut);
    }
    #signal-box.buy { border-left-color: var(--up); }
    #signal-box.sell { border-left-color: var(--dn); }
    #signal-title { font-size: 20px; font-weight: bold; }
    #signal-box.buy #signal-title { color: var(--up); }
    #signal-box.sell #signal-title { color: var(--dn); }

    .metrics-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }
    .metric-card {
      background: var(--card);
      border: 1px solid var(--line);
      padding: 8px;
      border-radius: 6px;
      font-size: 12px;
    }
    .metric-card small { display: block; color: var(--mut); margin-bottom: 2px; }
    .bar-bg { height: 6px; background: var(--dn); border-radius: 3px; overflow: hidden; margin-top: 4px; }
    .bar-fill { height: 100%; background: var(--up); width: 50%; }

    .fs-overlay-controls {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 10;
      display: none;
      gap: 4px;
    }
    body.is-fullscreen .fs-overlay-controls {
      display: flex;
    }
  </style>
</head>
<body>

  <header>
    <h1>Gold Engine (Binance)</h1>
    <span id="status">Connecting...</span>
  </header>

  <div class="controls-panel">
    <div class="tf-group">
      <button class="tf-btn" data-tf="1m">1M</button>
      <button class="tf-btn active" data-tf="5m">5M</button>
      <button class="tf-btn" data-tf="15m">15M</button>
      <button class="tf-btn" data-tf="1h">1H</button>
    </div>
    <div class="action-group">
      <button id="toggle-fs" class="fs-btn">Fullscreen ⛶</button>
    </div>
  </div>

  <div id="chart-container">
    <div class="fs-overlay-controls">
      <button class="tf-btn-fs" data-tf="1m">1m</button>
      <button class="tf-btn-fs" data-tf="5m">5m</button>
      <button class="tf-btn-fs" data-tf="15m">15m</button>
      <button class="tf-btn-fs" data-tf="1h">1h</button>
      <button id="exit-fs">Exit ✕</button>
    </div>
  </div>

  <div id="signal-box">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <span id="signal-title">WAIT</span>
      <span id="signal-tf" style="font-size:12px; color:var(--mut);">5M Analysis</span>
    </div>
    <div id="signal-levels" style="margin-top:6px; font-size:13px; font-weight:500;"></div>
  </div>

  <div class="metrics-grid">
    <div class="metric-card">
      <small>Taker Buy vs Sell Ratio</small>
      <span id="bs-ratio">50% / 50%</span>
      <div class="bar-bg"><div id="bs-bar" class="bar-fill"></div></div>
    </div>
    <div class="metric-card">
      <small>Volume POC (Estimate)</small>
      <span id="poc-val">-</span>
    </div>
    <div class="metric-card">
      <small>Liquidity High (BSL)</small>
      <span id="bsl-val">-</span>
    </div>
    <div class="metric-card">
      <small>Liquidity Low (SSL)</small>
      <span id="ssl-val">-</span>
    </div>
  </div>

<script>
  let currentTF = '5m';
  let ws = null;
  let chart = null;
  let candleSeries = null;
  let ema20Series = null;
  let ema50Series = null;

  const chartElement = document.getElementById('chart-container');
  const statusEl = document.getElementById('status');

  function initChart() {
    try {
      chart = LightweightCharts.createChart(chartElement, {
        layout: { 
          background: { type: 'solid', color: '#0f1218' }, 
          textColor: '#ecebe6' 
        },
        grid: { vertLines: { color: '#1d2330' }, horzLines: { color: '#1d2330' } },
        crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
        priceScale: { borderColor: '#26a69a' },
        timeScale: { borderColor: '#26a69a', timeVisible: true, secondsVisible: false }
      });

      candleSeries = chart.addCandlestickSeries({
        upColor: '#2fd3a0', downColor: '#ff5f7e',
        borderUpColor: '#2fd3a0', borderDownColor: '#ff5f7e',
        wickUpColor: '#2fd3a0', wickDownColor: '#ff5f7e'
      });

      ema20Series = chart.addLineSeries({ color: '#e6b450', lineWidth: 1 });
      ema50Series = chart.addLineSeries({ color: '#2196f3', lineWidth: 1 });

      window.addEventListener('resize', () => {
        chart.applyOptions({ width: chartElement.clientWidth, height: chartElement.clientHeight });
      });
    } catch (err) {
      statusEl.innerText = "Chart Init Err: " + err.message;
      statusEl.className = 'error';
    }
  }

  function toggleFullscreen() {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(err => console.log(err));
      document.body.classList.add('is-fullscreen');
    } else {
      document.exitFullscreen().catch(err => console.log(err));
      document.body.classList.remove('is-fullscreen');
    }
    setTimeout(() => {
      chart.applyOptions({ width: chartElement.clientWidth, height: chartElement.clientHeight });
    }, 100);
  }

  document.getElementById('toggle-fs').addEventListener('click', toggleFullscreen);
  document.getElementById('exit-fs').addEventListener('click', toggleFullscreen);

  function calculateEMA(data, period) {
    let k = 2 / (period + 1);
    let emaData = [];
    if(data.length === 0) return emaData;
    let ema = data[0].close;
    for (let i = 0; i < data.length; i++) {
      ema = data[i].close * k + ema * (1 - k);
      emaData.push({ time: data[i].time, value: ema });
    }
    return emaData;
  }

  async function loadData(tf) {
    statusEl.innerText = 'Loading ' + tf + '...';
    statusEl.className = '';
    
    try {
      let res = await fetch(`https://api.binance.com/api/v3/klines?symbol=PAXGUSDT&interval=${tf}&limit=200`);
      if (!res.ok) throw new Error(`HTTP Error ${res.status}`);
      
      let json = await res.json();
      if (!Array.isArray(json) || json.length === 0) throw new Error("Empty API Data");
      
      let candles = json.map(d => ({
        time: Math.floor(d[0] / 1000),
        open: parseFloat(d[1]),
        high: parseFloat(d[2]),
        low: parseFloat(d[3]),
        close: parseFloat(d[4]),
        volume: parseFloat(d[5]),
        takerBuyVol: parseFloat(d[9])
      }));

      // Sort just in case API returns unsorted data
      candles.sort((a, b) => a.time - b.time);

      candleSeries.setData(candles);
      ema20Series.setData(calculateEMA(candles, 20));
      ema50Series.setData(calculateEMA(candles, 50));

      analyzeStructure(candles);
      connectWebSocket(tf);

      statusEl.innerText = 'LIVE · PAXGUSDT';
      statusEl.className = 'live';
    } catch (e) {
      statusEl.innerText = 'Err: ' + e.message;
      statusEl.className = 'error';
      console.error(e);
    }
  }

  function connectWebSocket(tf) {
    if (ws) ws.close();
    ws = new WebSocket(`wss://stream.binance.com:9443/ws/paxgusdt@kline_${tf}`);

    ws.onmessage = (event) => {
      try {
        let msg = JSON.parse(event.data);
        let k = msg.k;
        let candle = {
          time: Math.floor(k.t / 1000),
          open: parseFloat(k.o),
          high: parseFloat(k.h),
          low: parseFloat(k.l),
          close: parseFloat(k.c),
          volume: parseFloat(k.v)
        };
        candleSeries.update(candle);
      } catch (err) {
        console.error("WS Update Error", err);
      }
    };
  }

  function analyzeStructure(candles) {
    if (candles.length < 50) return;
    let last = candles[candles.length - 1];

    let highList = candles.map(c => c.high);
    let lowList = candles.map(c => c.low);

    let maxHigh = Math.max(...highList.slice(-30));
    let minLow = Math.min(...lowList.slice(-30));

    document.getElementById('bsl-val').innerText = maxHigh.toFixed(2);
    document.getElementById('ssl-val').innerText = minLow.toFixed(2);

    let totalVol = candles.slice(-20).reduce((acc, c) => acc + c.volume, 0);
    let takerBuy = candles.slice(-20).reduce((acc, c) => acc + c.takerBuyVol, 0);
    let buyPct = totalVol > 0 ? Math.round((takerBuy / totalVol) * 100) : 50;
    let sellPct = 100 - buyPct;

    document.getElementById('bs-ratio').innerText = `${buyPct}% / ${sellPct}%`;
    document.getElementById('bs-bar').style.width = `${buyPct}%`;

    let sigBox = document.getElementById('signal-box');
    let sigTitle = document.getElementById('signal-title');
    let sigLevels = document.getElementById('signal-levels');

    let isBullish = last.close > last.open && buyPct > 52;
    let isBearish = last.close < last.open && sellPct > 52;

    if (isBullish) {
      sigBox.className = 'buy';
      sigTitle.innerText = 'BUY SIGNAL';
      let sl = (last.close - 2.5).toFixed(2);
      let tp1 = (last.close + 3.0).toFixed(2);
      let tp2 = (last.close + 6.0).toFixed(2);
      sigLevels.innerHTML = `Entry: <b>${last.close.toFixed(2)}</b> | SL: <span style="color:var(--dn)">${sl}</span> | TP1: <span style="color:var(--up)">${tp1}</span>`;
    } else if (isBearish) {
      sigBox.className = 'sell';
      sigTitle.innerText = 'SELL SIGNAL';
      let sl = (last.close + 2.5).toFixed(2);
      let tp1 = (last.close - 3.0).toFixed(2);
      let tp2 = (last.close - 6.0).toFixed(2);
      sigLevels.innerHTML = `Entry: <b>${last.close.toFixed(2)}</b> | SL: <span style="color:var(--dn)">${sl}</span> | TP1: <span style="color:var(--up)">${tp1}</span>`;
    } else {
      sigBox.className = '';
      sigTitle.innerText = 'WAIT / NEUTRAL';
      sigLevels.innerHTML = 'Consolidation or mixed confluence. Wait for liquidity sweep.';
    }
  }

  document.querySelectorAll('.tf-btn, .tf-btn-fs').forEach(btn => {
    btn.addEventListener('click', (e) => {
      let tf = e.target.getAttribute('data-tf');
      currentTF = tf;
      document.querySelectorAll('.tf-btn, .tf-btn-fs').forEach(b => b.classList.remove('active'));
      document.querySelectorAll(`[data-tf="${tf}"]`).forEach(b => b.classList.add('active'));
      document.getElementById('signal-tf').innerText = tf.toUpperCase() + ' Analysis';
      loadData(tf);
    });
  });

  // Delay init slightly to ensure DOM is ready on mobile browsers
  setTimeout(() => {
    initChart();
    loadData(currentTF);
  }, 200);
</script>
</body>
</html>
